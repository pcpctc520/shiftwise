<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShiftWise">
<meta name="theme-color" content="#1a1a2e">
<title>ShiftWise Local</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --a:#e94560;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --dark:#1a1a2e;--s:#fff;--s2:#f7f6f3;--s3:#edecea;
  --t:#1c1c1e;--t2:#555553;--t3:#99998f;
  --b:rgba(0,0,0,.09);--b2:rgba(0,0,0,.16);--r:9px;--rl:13px;
  --grn:#2d7a3a;--grnbg:#e8f5ea;--red:#b91c1c;--redbg:#fef2f2;
  --orange:#c05621;--orangebg:#fff3e6;
}
@media(prefers-color-scheme:dark){:root{
  --s:#1e1e1e;--s2:#2a2a28;--s3:#141412;--t:#f0f0ee;--t2:#aaa;--t3:#666;
  --b:rgba(255,255,255,.09);--b2:rgba(255,255,255,.18);
  --grnbg:rgba(45,122,58,.2);--redbg:rgba(185,28,28,.2);--orangebg:rgba(192,86,33,.18);
}}
body{font-family:var(--font);background:var(--s3);color:var(--t);font-size:14px;line-height:1.5}

/* SETUP */
.setup-screen{position:fixed;inset:0;background:var(--dark);z-index:9000;display:none;align-items:center;justify-content:center;padding:20px}
.setup-card{background:#fff;border-radius:20px;padding:34px 30px 26px;width:440px;max-width:100%;box-shadow:0 24px 80px rgba(0,0,0,.4);max-height:92vh;overflow-y:auto}
.brand{font-size:25px;font-weight:700;color:var(--dark);letter-spacing:-1px;margin-bottom:3px}.brand span{color:var(--a)}
.brand-tag{font-size:11px;color:#99998f;margin-bottom:26px;font-family:var(--mono)}
.ob-steps{display:flex;gap:5px;justify-content:center;margin-bottom:24px}
.ob-step{width:28px;height:4px;border-radius:2px;background:#e5e3de;transition:all .3s}
.ob-step.done{background:var(--a)}.ob-step.active{background:var(--a);opacity:.5}
.ob-title{font-size:19px;font-weight:600;color:var(--dark);margin-bottom:3px}
.ob-sub{font-size:13px;color:#888;margin-bottom:22px}
.ob-nav{display:flex;gap:9px;margin-top:18px}
.ob-back{flex:1;padding:11px;background:#f5f3ef;border:none;border-radius:9px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;color:#555}
.ob-next{flex:2;padding:11px;background:var(--a);border:none;border-radius:9px;color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer}
.color-picker-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.color-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s;flex-shrink:0}
.color-swatch.sel{border-color:var(--dark);transform:scale(1.18)}
.role-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.role-chip{padding:6px 12px;border:1.5px solid #ddd;border-radius:20px;font-size:13px;cursor:pointer;user-select:none;transition:all .15s;color:#555}
.role-chip.sel{border-color:var(--a);color:var(--a);background:rgba(233,69,96,.06)}
.loc-item{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#f5f3ef;border-radius:9px;margin-bottom:7px;font-size:13px;font-weight:500;color:var(--dark)}
.loc-del{background:none;border:none;cursor:pointer;color:#aaa;font-size:18px;line-height:1;padding:0;margin-left:auto}
.add-row{display:flex;gap:8px;margin-top:6px}

/* APP SHELL */
.app-shell{display:none;height:100vh;overflow:hidden;width:100%;flex-direction:row}
.sidebar{width:222px;background:var(--dark);display:flex;flex-direction:column;flex-shrink:0}
.sb-brand{padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:9px}
.sb-logo{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.sb-company{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-info{padding:6px 12px 4px;font-size:10px;color:rgba(255,255,255,.25);font-family:var(--mono);display:flex;align-items:center;justify-content:space-between}
.nav{flex:1;padding:8px 6px;overflow-y:auto}
.ns{font-size:9px;color:rgba(255,255,255,.18);text-transform:uppercase;letter-spacing:1.8px;padding:6px 8px 2px;margin-top:2px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;color:rgba(255,255,255,.46);font-size:12px;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;position:relative}
.ni:hover{background:rgba(255,255,255,.055);color:rgba(255,255,255,.8)}
.ni.on{background:rgba(233,69,96,.2);color:#fff;border-left:2px solid var(--a);padding-left:7px}
.nic{width:14px;text-align:center;flex-shrink:0;font-size:12px}
.ni-badge{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:var(--a);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.sb-foot{padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,.07)}
.sb-owner{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:4px}

/* MAIN */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{background:var(--s);border-bottom:.5px solid var(--b);padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:9px}
.tb-left{display:flex;align-items:center;gap:7px;min-width:0}
.pg-title{font-size:14px;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn{padding:5px 13px;border-radius:9px;font-size:12px;font-family:var(--font);cursor:pointer;font-weight:500;border:.5px solid var(--b2);background:var(--s);color:var(--t);transition:all .15s}
.btn:hover:not(:disabled){background:var(--s2)}.btn:disabled{opacity:.34;cursor:not-allowed}
.btn-p{background:var(--a);border-color:var(--a);color:#fff}.btn-p:hover:not(:disabled){opacity:.88}
.btn-grn{background:var(--grn);border-color:var(--grn);color:#fff}.btn-grn:hover:not(:disabled){opacity:.88}
.btn-danger{background:#fff0f0;border-color:#fca5a5;color:var(--red)}.btn-danger:hover:not(:disabled){background:#fee2e2}
.btn-sm{padding:3px 9px;font-size:11px}
.content{flex:1;overflow-y:auto;padding:14px 18px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{background:var(--s);border:.5px solid var(--b);border-radius:var(--rl);padding:13px}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cttl{font-size:12px;font-weight:500;color:var(--t2)}.sv{font-size:22px;font-weight:600;color:var(--t)}.ss{font-size:11px;color:var(--t3);margin-top:2px}
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin:2px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.dg{background:#52a332}.dr{background:#e24b4a}.dy{background:#ef9f27}
.erow{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border-radius:9px;border:.5px solid var(--b);margin-bottom:6px;background:var(--s)}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.enm{font-size:12px;font-weight:500;color:var(--t)}.emeta{font-size:11px;color:var(--t3);margin-top:1px}
.hdiv{height:.5px;background:var(--b);margin:9px 0}
.hbar{height:3px;border-radius:3px;background:var(--s3);margin-top:3px;overflow:hidden}.hfill{height:100%;border-radius:3px;background:var(--a)}
.ltabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.ltab{padding:3px 11px;border:.5px solid var(--b2);border-radius:20px;font-size:12px;cursor:pointer;color:var(--t2)}.ltab.on{background:var(--a);color:#fff;border-color:var(--a)}
.wknav{display:flex;align-items:center;gap:5px}
.wklbl{font-size:11px;color:var(--t2);font-family:var(--mono)}
.icb{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:.5px solid var(--b2);border-radius:8px;cursor:pointer;background:var(--s);color:var(--t2);font-size:11px}.icb:hover{background:var(--s2)}
.ff{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.fl{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px;display:block}
.fi{width:100%;padding:10px 12px;border:1.5px solid rgba(0,0,0,.14);border-radius:9px;font-family:var(--font);font-size:13px;color:var(--t);background:var(--s);outline:none;transition:border .15s;margin-bottom:12px}
.fi:focus{border-color:var(--a)}
.fsel{padding:5px 8px;border:.5px solid var(--b2);border-radius:9px;background:var(--s2);color:var(--t);font-family:var(--font);font-size:12px;cursor:pointer}
.sklbl{display:inline-flex;align-items:center;padding:4px 9px;border:.5px solid var(--b2);border-radius:20px;cursor:pointer;font-size:11px;color:var(--t2);user-select:none;margin:2px}
.sklbl.sel{border-color:var(--a);color:var(--a);background:rgba(233,69,96,.06)}
.cbrow{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;color:var(--t);cursor:pointer;user-select:none}
.cbrow input[type=checkbox]{accent-color:var(--a);width:13px;height:13px;cursor:pointer}
.empty{text-align:center;padding:26px;color:var(--t3);font-size:13px}
.avail-days{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.avday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 4px;border:.5px solid var(--b);border-radius:5px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;user-select:none;min-width:28px}
.avday input{accent-color:var(--a);width:12px;height:12px;cursor:pointer;margin:0}
.avday.avon{border-color:var(--a);color:var(--a);background:rgba(233,69,96,.06)}
/* shift config */
.shift-cfg-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
.shift-cfg-tbl th{font-size:11px;font-weight:500;color:var(--t3);padding:5px 7px;text-align:center;border-bottom:.5px solid var(--b);background:var(--s2)}
.shift-cfg-tbl th:first-child{text-align:left}
.shift-cfg-tbl td{padding:5px;text-align:center;border-bottom:.5px solid var(--b);vertical-align:middle}
.shift-cfg-tbl td:first-child{font-weight:500;color:var(--t2);text-align:left}
.shift-cfg-tbl input[type=time]{padding:3px 5px;border:.5px solid var(--b2);border-radius:5px;font-family:var(--mono);font-size:11px;background:var(--s2);color:var(--t)}
.shift-cfg-tbl input[type=checkbox]{accent-color:var(--a);width:14px;height:14px;cursor:pointer}
.shift-row{display:flex;align-items:center;gap:5px;margin:3px 0}
.shift-time-pair{display:flex;align-items:center;gap:3px;font-size:11px}
.add-shift-btn{font-size:10px;padding:2px 7px;border-radius:20px;cursor:pointer;background:var(--s2);color:var(--t2);border:none;margin-top:3px}
.add-shift-btn:hover{background:var(--s3)}.add-shift-btn:disabled{opacity:.35;cursor:not-allowed}
.del-shift-btn{background:none;border:none;cursor:pointer;color:var(--t3);font-size:13px;line-height:1;padding:0 2px;flex-shrink:0}
.del-shift-btn:hover{color:var(--red)}
/* calendar */
.swrap{overflow-x:auto}
.stbl{border-collapse:separate;border-spacing:3px;width:100%}
.stbl th{font-size:10px;font-weight:600;padding:4px;text-align:center;white-space:nowrap;color:var(--t3)}
.stbl th.dth{text-align:left;min-width:60px}
.stbl td.dtd{font-size:11px;font-weight:500;color:var(--t2);padding:3px 6px;vertical-align:middle;background:var(--s2);border-radius:6px;white-space:nowrap}
.stbl td.slot{border-radius:7px;border:.5px solid var(--b);background:var(--s);padding:5px;vertical-align:top;min-width:100px;cursor:pointer;transition:background .1s}
.stbl td.slot:hover{border-color:var(--b2)}
.stbl td.slot.filled{background:var(--grnbg);border-color:rgba(45,122,58,.3)}
.stbl td.slot.empty-slot{background:var(--redbg);border-color:rgba(185,28,28,.3)}
.stbl td.slot.conflict{background:var(--orangebg)!important;border-color:rgba(192,86,33,.5)!important}
.stbl td.slot.cl{background:var(--s3);border-style:dashed;text-align:center;vertical-align:middle}
.stbl td.slot.drag-over{background:rgba(233,69,96,.1);border-color:var(--a);border-style:dashed}
.stbl td.slot.published{background:#e8f0fe;border-color:rgba(26,95,165,.3)}
.snm{font-size:10px;font-weight:600;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stm{font-size:9px;color:var(--t3);margin-top:1px}
.sem{font-size:10px;color:var(--red);font-style:italic;font-weight:500}
.phd{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;color:#fff}
.emp-chip{display:flex;align-items:center;gap:3px;padding:3px 6px;border-radius:6px;cursor:grab;user-select:none;margin-bottom:3px;border:.5px solid transparent;font-size:10px;transition:all .12s}
.emp-chip:hover{border-color:var(--b2)}.emp-chip.dragging{opacity:.4;cursor:grabbing}
.emp-chip.conflict-chip{background:var(--orangebg);border-color:rgba(192,86,33,.4)}
.conflict-icon{font-size:11px;margin-left:2px;cursor:help}
/* publish banner */
.publish-banner{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(233,69,96,.3);border-radius:var(--rl);padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.publish-banner.published{background:linear-gradient(135deg,#0a2e16,#0f4023);border-color:rgba(45,122,58,.4)}
.pb-txt{color:#fff}.pb-ttl{font-size:14px;font-weight:500;margin-bottom:2px}.pb-sub{font-size:11px;color:rgba(255,255,255,.45)}
.pub-btn{background:var(--grn);border:none;color:#fff;font-family:var(--font);font-size:13px;font-weight:600;padding:9px 20px;border-radius:9px;cursor:pointer;white-space:nowrap}
.pub-btn:hover{opacity:.88}.pub-btn:disabled{opacity:.45;cursor:not-allowed}
.pub-btn.published-state{background:rgba(255,255,255,.12);cursor:default;opacity:1}
/* approvals */
.approval-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border:.5px solid var(--b);border-radius:9px;margin-bottom:7px;background:var(--s)}
.approval-approve{padding:4px 10px;background:var(--grnbg);color:var(--grn);border:.5px solid rgba(45,122,58,.3);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500}
.approval-approve:hover{background:#d4edda}
.approval-decline{padding:4px 10px;background:var(--redbg);color:var(--red);border:.5px solid rgba(185,28,28,.3);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500}
.approval-decline:hover{background:#fce8e8}
.ublk{display:flex;align-items:center;gap:7px;padding:7px 10px;border:.5px solid var(--b);border-radius:9px;margin-bottom:5px;background:var(--s)}
.ublk.pending{border-color:rgba(233,69,96,.4);background:rgba(233,69,96,.03)}
.ublk.approved{border-color:rgba(45,122,58,.4);background:var(--grnbg)}
.ublk.declined{border-color:rgba(185,28,28,.3);background:var(--redbg);opacity:.65}
.ublk-status{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;flex-shrink:0}
.ublk-status.pending{background:rgba(233,69,96,.12);color:var(--a)}
.ublk-status.approved{background:var(--grnbg);color:var(--grn)}
.ublk-status.declined{background:var(--redbg);color:var(--red)}
/* AI scheduler */
.ai-pan{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(233,69,96,.3);border-radius:var(--rl);padding:15px;margin-bottom:13px;position:relative;overflow:hidden}
.ai-pan::before{content:'';position:absolute;top:-22px;right:-22px;width:75px;height:75px;border-radius:50%;background:rgba(233,69,96,.07);pointer-events:none}
.ai-ttl{font-size:14px;font-weight:500;color:#fff;margin-bottom:2px}
.ai-sub{font-size:11px;color:rgba(255,255,255,.34);margin-bottom:11px}
.ai-opts{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.aiopt{padding:3px 9px;border:1px solid rgba(255,255,255,.12);border-radius:20px;font-size:10px;color:rgba(255,255,255,.48);cursor:pointer;user-select:none}
.aiopt.on{border-color:var(--a);color:var(--a);background:rgba(233,69,96,.1)}
.gbtn{background:var(--a);border:none;color:#fff;font-family:var(--font);font-size:12px;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px}
.gbtn:disabled{opacity:.44;cursor:not-allowed}
.spinner{width:11px;height:11px;border:2px solid rgba(255,255,255,.24);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.progbar{height:3px;background:rgba(255,255,255,.09);border-radius:2px;margin-top:8px;overflow:hidden;display:none}
.progfill{height:100%;background:var(--a);border-radius:2px;width:0%;transition:width .35s}
.glog{background:rgba(0,0,0,.27);border-radius:9px;padding:7px;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.38);max-height:62px;overflow-y:auto;display:none;margin-top:7px}
.lok{color:#52a332}.linf{color:#378add}
.okb{background:var(--grnbg);color:var(--grn);border-radius:9px;padding:3px 8px;font-size:11px;font-weight:500}
.stabb{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:20px;background:#eeedfe;color:#533ab7;font-weight:500}
/* toggle */
.tog{width:26px;height:14px;border-radius:7px;background:var(--s3);border:.5px solid var(--b2);cursor:pointer;position:relative;transition:background .2s;display:inline-block}
.tog.on{background:var(--a)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on::after{left:14px}
/* PIN setup */
.pin-setup{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:210px;margin:8px auto 4px}
.psk{padding:12px;text-align:center;font-size:17px;font-weight:600;color:var(--dark);background:#f5f3ef;border-radius:9px;cursor:pointer;user-select:none;border:1.5px solid transparent;transition:all .15s}
.psk:hover{background:#ebe8e3}.psk:active{transform:scale(.94)}.psk.del{font-size:15px;color:#888}
.psd-row{display:flex;gap:8px;justify-content:center;margin:10px 0 6px}
.psd{width:12px;height:12px;border-radius:50%;border:2px solid #ccc;transition:all .15s}
.psd.on{background:var(--a);border-color:var(--a)}
.phone-wrap{display:flex;align-items:center;border:1.5px solid rgba(0,0,0,.14);border-radius:9px;overflow:hidden;margin-bottom:12px;background:#fff}
.phone-flag{padding:9px 11px;font-size:13px;color:#555;border-right:1px solid #eee;background:#f9f8f5;font-family:var(--mono);white-space:nowrap}
.phone-field{flex:1;padding:9px 11px;border:none;outline:none;font-family:var(--font);font-size:13px;color:var(--t);background:transparent}
/* modals */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:5000;align-items:center;justify-content:center}
.mbg.open{display:flex}
.modal{background:var(--s);border-radius:15px;padding:20px;width:440px;max-width:96vw;border:.5px solid var(--b);max-height:84vh;overflow-y:auto}
.cfm{background:var(--s);border-radius:15px;padding:22px;width:350px;max-width:96vw;border:.5px solid var(--b)}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mttl{font-size:14px;font-weight:600}.mcl{background:none;border:none;cursor:pointer;color:var(--t3);font-size:20px;line-height:1;padding:0}
/* notifications */
.notif-bell{position:relative;cursor:pointer;padding:5px;border-radius:8px;transition:all .15s}
.notif-bell:hover{background:var(--s2)}
.notif-bell-icon{font-size:18px}
.notif-bell-badge{position:absolute;top:2px;right:2px;width:14px;height:14px;background:var(--a);border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.notif-panel{position:absolute;top:46px;right:0;width:320px;background:var(--s);border:.5px solid var(--b);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.15);z-index:400;display:none;max-height:400px;overflow-y:auto}
.notif-panel.open{display:block}
.notif-panel-hd{padding:11px 14px;font-size:13px;font-weight:600;border-bottom:.5px solid var(--b);display:flex;align-items:center;justify-content:space-between}
.notif-item{padding:11px 14px;border-bottom:.5px solid var(--b);cursor:pointer;transition:background .1s}
.notif-item:hover{background:var(--s2)}
.notif-item.unread{background:rgba(233,69,96,.04)}
.notif-item-title{font-size:12px;font-weight:500;color:var(--t)}
.notif-item-sub{font-size:11px;color:var(--t3);margin-top:2px}
.notif-item-time{font-size:10px;color:var(--t3);margin-top:3px}
.notif-empty{padding:20px;text-align:center;font-size:12px;color:var(--t3)}
/* toast */
.notif-toast{position:fixed;top:14px;right:14px;background:var(--dark);color:#fff;padding:10px 14px;border-radius:9px;border-left:3px solid var(--a);font-size:12px;z-index:9999;opacity:0;transform:translateY(-8px);transition:all .3s;pointer-events:none;max-width:300px}
.notif-toast.show{opacity:1;transform:translateY(0)}
/* save label */
.save-lbl{font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.3);margin-bottom:4px}

/* MOBILE: stack sidebar on small screens */
@media(max-width:640px){
  .app-shell{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;height:auto;flex-shrink:0}
  .sb-brand{flex:1;border-bottom:none;border-right:1px solid rgba(255,255,255,.07)}
  .sb-info{display:none}
  .nav{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px 6px;white-space:nowrap;flex:0 0 100%;order:3;border-top:1px solid rgba(255,255,255,.07)}
  .ni{display:inline-flex;flex-direction:column;align-items:center;padding:5px 8px;font-size:10px;gap:2px;min-width:52px;flex-shrink:0;margin-bottom:0}
  .nic{width:auto;font-size:14px}
  .ni.on{border-left:none;border-bottom:2px solid var(--a);padding-left:8px;border-radius:0}
  .ns{display:none}
  .sb-foot{order:2;padding:6px 12px;border-top:none;border-left:1px solid rgba(255,255,255,.07)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setupScreen" class="setup-screen">
  <div class="setup-card">
    <div class="brand">Shift<span>Wise</span></div>
    <div class="brand-tag">Local scheduling &mdash; no account needed</div>
    <div class="ob-steps" id="obSteps"></div>
    <div id="obContent"></div>
  </div>
</div>

<!-- APP -->
<div id="appShell" class="app-shell">
  <div class="sidebar">
    <div class="sb-brand">
      <div class="sb-logo" id="sbLogo">SW</div>
      <div style="flex:1;min-width:0"><div class="sb-company" id="sbCo">ShiftWise</div><div class="sb-plan" style="font-size:10px;color:rgba(255,255,255,.28);font-family:var(--mono)">Local &middot; Auto-saving</div></div>
    </div>
    <div class="sb-info">
      <span id="saveLbl">ready</span>
      <span id="sbOwner" style="color:rgba(255,255,255,.3)"></span>
    </div>
    <nav class="nav" id="mainNav"></nav>
    <div class="sb-foot">
      <button class="btn btn-danger btn-sm" style="width:100%;font-size:10px" onclick="clearAllData()">&#9888; Reset All Data</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="tb-left"><div class="pg-title" id="pgTitle">Dashboard</div></div>
      <div class="tb-right" id="tbRight"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODALS -->
<div class="mbg" id="mAddEmp">
  <div class="modal">
    <div class="mhd"><div class="mttl">Add New Employee</div><button class="mcl" onclick="cm('mAddEmp')">&times;</button></div>
    <div class="ff"><label class="fl">Full name</label><input class="fi" id="aeName" placeholder="e.g. Alex Johnson" style="margin:0"></div>
    <div style="background:var(--s2);border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px">Login ID (for your records)</div>
      <div class="ff" style="margin-bottom:8px"><label class="fl">Phone number</label><div class="phone-wrap" style="margin:0"><div class="phone-flag">+1</div><input class="phone-field" id="aePhone" type="tel" placeholder="555 000 0000"></div></div>
      <div class="ff" style="margin-bottom:0"><label class="fl">Email (optional)</label><input class="fi" id="aeEmail" type="email" placeholder="employee@email.com" style="margin:0"></div>
    </div>
    <div class="ff"><label class="fl">Role(s)</label><div id="aeRoles"></div></div>
    <div class="ff"><label class="fl">Locations</label><div id="aeLocs"></div></div>
    <div class="ff"><label class="fl">4-digit PIN (for your records)</label><div class="psd-row" id="pinSetupDisp"></div><div class="pin-setup" id="pinSetupPad"></div></div>
    <div class="ff"><label class="fl">Max shifts / week</label><select class="fsel" id="aeMax" style="width:90px"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option></select></div>
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-p btn-sm" onclick="addEmp()">Add Employee</button><button class="btn btn-sm" onclick="cm('mAddEmp')">Cancel</button></div>
  </div>
</div>
<div class="mbg" id="mEditEmp"><div class="modal"><div class="mhd"><div class="mttl" id="editTitle">Edit</div><button class="mcl" onclick="cm('mEditEmp')">&times;</button></div><div id="editBody"></div></div></div>
<div class="mbg" id="mCfm"><div class="cfm"><div style="font-size:15px;font-weight:600;margin-bottom:9px">Confirm</div><div style="font-size:13px;color:var(--t2);margin-bottom:16px;line-height:1.6" id="cfmMsg"></div><div style="display:flex;gap:9px"><button class="btn btn-danger btn-sm" id="cfmOk">Confirm</button><button class="btn btn-sm" onclick="cm('mCfm');document.getElementById('cfmOk').style.display=''">Cancel</button></div></div></div>
<div class="mbg" id="mUnavail">
  <div class="modal">
    <div class="mhd"><div class="mttl">Add Leave Block</div><button class="mcl" onclick="cm('mUnavail')">&times;</button></div>
    <div class="ff"><label class="fl">Date</label><input class="fi" type="date" id="uDate" style="margin:0"></div>
    <div class="g2" style="gap:10px;margin-bottom:12px"><div class="ff"><label class="fl">From</label><input class="fi" type="time" id="uFrom" value="09:00" style="margin:0"></div><div class="ff"><label class="fl">To</label><input class="fi" type="time" id="uTo" value="17:00" style="margin:0"></div></div>
    <div class="ff"><label class="fl">Reason (optional)</label><input class="fi" type="text" id="uReason" placeholder="e.g. Doctor appointment" style="margin:0"></div>
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-p btn-sm" onclick="addUnavail()">Add Leave Block</button><button class="btn btn-sm" onclick="cm('mUnavail')">Cancel</button></div>
  </div>
</div>
<div class="mbg" id="mDragSlot"><div class="modal" style="width:360px"><div class="mhd"><div class="mttl" id="dragSlotTitle">Assign Shift</div><button class="mcl" onclick="cm('mDragSlot')">&times;</button></div><div id="dragSlotBody"></div></div></div>
<div class="notif-toast" id="toast"></div>
